<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>Evaluasi OBE – S1 Administrasi Rumah Sakit UNBL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171c26; --ink-2:#4b5563; --ink-3:#7b8695;
  --paper:#fbf2ea; --surface:#ffffff; --line:#f0dccd; --line-2:#f6e7dc;
  --indigo:#c26236; --indigo-2:#a94f28; --indigo-tint:#ffe6d6;
  --kunyit:#c98a12; --kunyit-tint:#fdf3e0;
  --ok:#2c7a56; --ok-tint:#e6f3ec; --bad:#a93f2c; --bad-tint:#fae9e4; --mid:#8a6a14;
  --sans:Arial,Helvetica,"Segoe UI",system-ui,sans-serif;
  --serif:Arial,Helvetica,"Segoe UI",system-ui,sans-serif;
  --r-sm:8px; --r-md:12px;
  --sh:0 1px 2px rgba(17,24,39,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right}
a{color:var(--indigo);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* Kerangka */
.app{display:grid;grid-template-columns:266px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:22px 22px 16px}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15;color:var(--indigo);letter-spacing:-.2px}
.brand span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.brand .ver{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:var(--indigo);background:var(--indigo-tint);padding:1px 8px;border-radius:99px;letter-spacing:.02em}
.period{padding:0 18px 16px;display:grid;grid-template-columns:1fr 96px;gap:6px;border-bottom:1px solid var(--line-2)}
.period label{grid-column:1/-1;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.period select{padding:7px 6px;font-size:13.5px}
.nav{padding:12px 12px 24px;flex:1}
.nav h6{margin:18px 10px 6px;font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);font-size:14px;line-height:1.3}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--indigo-tint);color:var(--indigo);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.who{padding:14px 20px;border-top:1px solid var(--line-2);font-size:13px;background:var(--surface)}
.who strong{display:block}
.who small{color:var(--ink-3)}
.main{min-width:0}
.topbar{display:none}
.page{max-width:1200px;padding:34px 40px 72px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.pagehead h1{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.15;margin:0;letter-spacing:-.3px}
.pagehead p{margin:8px 0 0;color:var(--ink-2);max-width:70ch;font-size:14.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Kontrol */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;white-space:nowrap;box-shadow:var(--sh);transition:background .12s,border-color .12s}
.btn:hover{border-color:#c9d1dc;background:#fcfdfe}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo-2)}
.btn.danger{color:var(--bad);border-color:#e6c6bd}
.btn.ghost{border-color:transparent;background:none;color:var(--indigo);padding:4px 6px;box-shadow:none}
.btn.ghost:hover{background:var(--indigo-tint)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
input[type=text],input[type=number],input[type=email],select,textarea{border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-tint)}
.field{display:grid;gap:5px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--ink-2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=text]{width:280px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:7px;align-items:center;font-size:13.5px}

/* Permukaan */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:24px;box-shadow:var(--sh);overflow:hidden}
.panel>header{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.panel>header h2{font-size:15.5px;margin:0;font-weight:600;letter-spacing:-.1px}
.panel>header p{margin:3px 0 0;font-size:13px;color:var(--ink-3);max-width:80ch}
.panel .body{padding:18px 20px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 16px;border-bottom:1px solid var(--line-2);vertical-align:top;text-align:left}
th{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;background:#fbfcfd}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr:hover td{background:#fbfcfe}
td.code{font-weight:600;white-space:nowrap}
.muted{color:var(--ink-3)}
.small{font-size:12.8px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--indigo-tint);color:var(--indigo);margin:1px 3px 1px 0;white-space:nowrap;line-height:1.5}
.tag.warn{background:var(--kunyit-tint);color:var(--mid)}
.tag.bad{background:var(--bad-tint);color:var(--bad)}
.tag.ok{background:var(--ok-tint);color:var(--ok)}
.tag.plain{background:#f1f3f6;color:var(--ink-2)}
.note{border:1px solid var(--kunyit);border-left-width:4px;background:var(--kunyit-tint);padding:11px 16px;border-radius:var(--r-sm);margin:0 0 18px;font-size:13.5px}
.note.bad{border-color:var(--bad);background:var(--bad-tint)}
.note.info{border-color:var(--indigo);background:var(--indigo-tint)}
.empty{padding:34px 20px;text-align:center;color:var(--ink-2)}
.lead{font-size:15px;margin:0 0 20px;max-width:78ch;color:var(--ink-2)}

/* Ringkasan angka */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:24px;box-shadow:var(--sh)}
.stat{background:var(--surface);padding:16px 20px}
.stat span{display:block;font-size:12.5px;color:var(--ink-3)}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.stat small{color:var(--ink-3);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3);padding:12px 20px;border-top:1px solid var(--line-2);background:#fbfcfd}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Alur kelas */
.pipe{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:22px;overflow:hidden;box-shadow:var(--sh)}
.pipe button{border:0;background:none;text-align:left;padding:14px 18px;cursor:pointer;border-right:1px solid var(--line-2);position:relative}
.pipe button:last-child{border-right:0}
.pipe button:hover{background:#fbfcfe}
.pipe b{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
.pipe small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:3px;padding-left:29px}
.pipe .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#f1f3f6;color:var(--ink-3);border:1px solid var(--line)}
.pipe .done .dot{background:var(--ok);color:#fff;border-color:var(--ok)}
.pipe .warn .dot{background:var(--kunyit);color:#fff;border-color:var(--kunyit)}
.pipe .bad .dot{background:var(--bad);color:#fff;border-color:var(--bad)}
.pipe button[aria-current="step"]{background:var(--indigo-tint);box-shadow:inset 0 -3px 0 var(--indigo)}

/* Batang capaian */
.bars{display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:76px 1fr 104px;gap:14px;align-items:center}
.barrow .lbl{font-weight:600;font-size:13px}
.barrow .num{white-space:nowrap}
.minibar{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;min-width:170px}
.bar{height:12px;background:#eef1f5;border-radius:99px;position:relative}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--indigo);border-radius:99px}
.bar>span.low{background:var(--bad)}
.bar>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--kunyit);border-radius:2px}
.bar.na{background:repeating-linear-gradient(45deg,#eef1f5,#eef1f5 4px,#f8fafb 4px,#f8fafb 8px)}

/* Kisi nilai */
.gridin{width:70px;text-align:right;padding:5px 8px}
.gridin.err{border-color:var(--bad);background:var(--bad-tint)}
.sticky1{position:sticky;left:0;background:#fff;z-index:1;min-width:212px}
th.sticky1{background:#fbfcfd}
.sum{font-weight:600}
.sum.bad{color:var(--bad)}
.sum.ok{color:var(--ok)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matin{width:78px;text-align:right;padding:5px 8px;-moz-appearance:textfield}
.matin::-webkit-outer-spin-button,.matin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--indigo);border-color:var(--indigo);font-weight:600}

.twocol{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
details summary{cursor:pointer;color:var(--indigo);font-size:13px}

dialog{border:0;border-radius:var(--r-md);padding:0;width:min(660px,94vw);box-shadow:0 24px 60px rgba(17,24,39,.22)}
dialog::backdrop{background:rgba(23,28,38,.45)}
dialog header{padding:18px 22px;border-bottom:1px solid var(--line-2)}
dialog header h3{margin:0;font-size:17px;font-weight:600}
dialog .dbody{padding:18px 22px;max-height:66vh;overflow:auto}
dialog footer{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:8px;background:#fbfcfd}

#toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-sm);font-size:14px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:50;max-width:380px;box-shadow:0 10px 30px rgba(17,24,39,.25)}
#toast.show{opacity:1;transform:none}
#toast.err{background:var(--bad)}
.loading{display:grid;place-items:center;height:100vh;color:var(--ink-3)}

.report .panel>header h2{font-family:var(--serif);font-weight:600;font-size:19px}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 50px rgba(0,0,0,.18)}
  .rail.open{transform:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .page{padding:22px 16px 72px}
  .pagehead h1{font-size:24px}
  .twocol,.grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .pipe{grid-template-columns:1fr 1fr}
  .pipe button:nth-child(2){border-right:0}
  .pipe button:nth-child(-n+2){border-bottom:1px solid var(--line-2)}
  .toolbar input[type=text]{width:100%}
  th,td{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;font-size:11px;color:#000}
  .rail,.topbar,.appbar,.actions,.toolbar,.tabs,.pipe,.legend,.noprint,#toast{display:none!important}
  .app{display:block}
  .page{max-width:none;padding:0}
  .panel{border:1px solid #ccc;box-shadow:none;margin-bottom:12px;break-inside:avoid}
  .panel>header{padding:6px 8px}
  .panel .body{padding:6px 8px}
  .stats{box-shadow:none}
  th,td{padding:4px 6px}
  .scroll{overflow:visible}
}

/* ============ Tema Peach + tampilan 3D + bilah atas (v1.2) ============ */
:root{
  --sh:0 1px 2px rgba(150,90,55,.10);
  --sh-md:0 6px 18px rgba(150,90,55,.14);
  --sh-lg:0 16px 40px rgba(150,90,55,.18);
}
body{
  background:
    radial-gradient(1100px 460px at 100% -8%, #ffe2cf 0%, rgba(255,226,207,0) 60%),
    radial-gradient(900px 460px at -6% 4%, #ffefe3 0%, rgba(255,239,227,0) 55%),
    var(--paper);
  background-attachment:fixed;
}
/* Bilah atas: info akun + tombol di pojok kanan */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:12px 26px;background:linear-gradient(180deg,#ffffff,#fff4ec);
  border-bottom:1px solid #f0d6c5;box-shadow:0 4px 14px rgba(150,90,55,.10)}
.appbar-title{font-weight:700;color:var(--indigo);letter-spacing:-.2px;font-size:15px}
.appbar .menu-btn{display:none}
.acct{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.acct-info{text-align:right;line-height:1.18;max-width:240px}
.acct-info strong{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-info small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-sel{max-width:220px}
/* Kartu & panel tampak terangkat (3D) */
.panel,.stats,.pipe{box-shadow:var(--sh-md);border-color:#f2ddce}
.panel{background:linear-gradient(180deg,#ffffff,#fffaf6)}
.stat{background:linear-gradient(180deg,#ffffff,#fff6ef)}
.rail{box-shadow:3px 0 16px rgba(150,90,55,.07);background:linear-gradient(180deg,#fffdfb,#fff5ee)}
.brand .ver{box-shadow:0 2px 6px rgba(194,98,54,.28)}
dialog{box-shadow:0 30px 70px rgba(120,60,30,.30)}
/* Tombol 3D + umpan balik klik */
.btn{background:linear-gradient(180deg,#ffffff,#f7e9df);border-color:#eccdba;
  box-shadow:0 2px 0 #ecceba,0 5px 12px rgba(150,90,55,.14)}
.btn:hover{background:linear-gradient(180deg,#ffffff,#f3e0d3);border-color:#e3b79c}
.btn:active{transform:translateY(2px);box-shadow:inset 0 3px 8px rgba(150,90,55,.22)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--indigo-tint),0 2px 0 #ecceba}
.btn.primary{background:linear-gradient(180deg,#e07a4a,#c25d34);border-color:#b4531f;color:#fff;
  text-shadow:0 1px 1px rgba(120,50,20,.35);box-shadow:0 2px 0 #a94f28,0 8px 18px rgba(210,105,55,.38)}
.btn.primary:hover{background:linear-gradient(180deg,#e9865a,#cd6539)}
.btn.primary:active{transform:translateY(2px);box-shadow:inset 0 3px 9px rgba(120,50,20,.40)}
.btn.danger{background:linear-gradient(180deg,#ffffff,#fbeae5)}
.btn.ghost{box-shadow:none;background:none;border-color:transparent}
.btn.ghost:hover{background:var(--indigo-tint)}
.btn.ghost:active{transform:translateY(1px);background:#ffd9c4}
/* Tanda tombol/menu yang sedang aktif atau baru diklik */
.btn.active,.btn[aria-pressed="true"]{background:linear-gradient(180deg,#e07a4a,#c25d34)!important;border-color:#b4531f!important;color:#fff!important;text-shadow:0 1px 1px rgba(120,50,20,.35)}
.nav button{transition:background .12s,color .12s,box-shadow .12s,transform .06s}
.nav button:active{transform:translateY(1px)}
.nav button[aria-current="page"]{background:linear-gradient(180deg,#ffd7c0,#ffe9db);color:#a94f28;font-weight:700;
  box-shadow:0 3px 10px rgba(194,98,54,.22),inset 0 0 0 1px #ffcdb0}
.pipe button[aria-current="step"]{box-shadow:inset 0 -3px 0 var(--indigo),0 6px 16px rgba(194,98,54,.18)}
/* ---------- RPS ---------- */
.rps{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;padding:26px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-md);margin-bottom:24px}
.rps table{width:100%;border-collapse:collapse;margin:0 0 12px}
.rps th,.rps td{border:1px solid #444;padding:5px 7px;vertical-align:top;text-align:left;font-size:11.5px}
.rps th{background:#fde3d3;font-weight:700;color:#111;white-space:normal;text-transform:none;letter-spacing:0;position:static}
.rps .ctr{text-align:center;vertical-align:middle}
.rps .chk{text-align:center;font-weight:700;vertical-align:middle}
.rps .lbl{width:170px;font-weight:700;background:#fff5ee}
.rps .title{text-align:center;font-size:15px;font-weight:700;letter-spacing:.04em;background:#fbd0b6}
.rps .inst b{display:block;font-size:13px}
.rps .logo{width:70px;text-align:center;vertical-align:middle}
.rps .logo span{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;border:2px solid #c26236;color:#c26236;font-weight:700;font-size:12px}
.rps .sign{height:64px;vertical-align:bottom;text-align:center}
.rps ol,.rps ul{margin:0;padding-left:18px}
.rps .sub{font-size:11px}
.rps-scroll{overflow-x:auto}
.rps-fill{min-height:1.5em;white-space:pre-wrap;outline:none;background:#fff8f2;border-bottom:1px dashed #e3a986;border-radius:3px;padding:1px 3px}
td.rps-fill{border:1px solid #444;border-bottom:1px solid #444}
.rps-fill[contenteditable="true"]:hover{background:#fff1e6}
.rps-fill:focus{background:#fff;box-shadow:inset 0 0 0 2px #f0ad86}
.rps-fill:empty::before{content:attr(data-ph);color:#b9a597;font-style:italic}
.rps-week{margin-top:18px}
.rps-week table{table-layout:fixed}
.rps td,.rps th{overflow-wrap:anywhere}
.rps .notes{font-size:10.5px;color:#444}
.rps-bar{position:sticky;top:58px;box-shadow:0 6px 10px -8px rgba(150,90,55,.35);z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--paper);padding:10px 0;margin-bottom:8px}
@page{size:A4;margin:12mm}
@media print{
  .rps{border:0;box-shadow:none;padding:0;margin:0;font-size:10.5px}
  .rps th,.rps td{font-size:10px;padding:3px 5px}
  .rps-fill{background:none!important;border-bottom:0;box-shadow:none}
  .rps-fill:empty::before{content:""}
  .rps th,.rps .title,.rps .lbl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rps-week{break-before:page}
  .rps tr{break-inside:avoid}
  .rps-bar{display:none!important}
  body{background:#fff!important}
  .rps-week td,.rps-week th{padding:2px 4px;font-size:9.5px}
  .rps-week .rps-fill{min-height:1.2em}
}
@media (max-width:980px){
  .appbar{padding:10px 14px;gap:10px}
  .appbar .menu-btn{display:inline-flex}
  .appbar-title{display:none}
  .acct-info{max-width:150px}
}
</style>

}

const PER = () => ({ ta: UI.ta || SET().ta, smt: UI.smt || SET().smt });

/* ---------- team teaching ----------
   kelas.dosen = dosen PJMK (penanggung jawab), kelas.tim = [id dosen anggota tim].
   Nilai tiap dosen disimpan terpisah: nilai/<idKelas>~<idDosen> = { scores }.
   Dokumen nilai/<idKelas> menyimpan status draft/final (dan nilai lama sebelum team teaching).
   Nilai komponen = rata-rata nilai dari semua dosen yang mengisi; komponen Observasi/partisipasi
   hanya diambil dari dosen PJMK (berasal dari kehadiran). */
const timOf = k => [...new Set([k.dosen, ...(k.tim || [])].filter(Boolean))];
const isObs = kp => !!kp && kp.bentuk === "Observasi/partisipasi";
const nkey = (kid, did) => kid + "~" + did;
function nilaiBy(k) {
  const out = {}, legacy = (DB.nilai.get(k.id) || {}).scores || {};
  timOf(k).forEach(d => { const r = DB.nilai.get(nkey(k.id, d)); if (r) out[d] = r.scores || {}; else if (d === k.dosen && Object.keys(legacy).length) out[d] = legacy; });
  return out;
}
function hasAnyNilai(k) {
  if (Object.keys((DB.nilai.get(k.id) || {}).scores || {}).length) return true;
  return all("nilai").some(r => r.kelas === k.id && Object.keys(r.scores || {}).length);
}
function combineScores(k, komp, by) {
  const sc = {}, cnt = {};
  (k.peserta || []).forEach(nim => {
    const o = sc[nim] = {}, c = cnt[nim] = {};
    komp.forEach(kp => {
      const src = isObs(kp) ? [k.dosen] : Object.keys(by);
      const v = src.map(d => ((by[d] || {})[nim] || {})[kp.id]).filter(isNum).map(Number);
      if (v.length) { o[kp.id] = v.reduce((a, b) => a + b, 0) / v.length; c[kp.id] = v.length; }
    });
  });
  return { sc, cnt };
}
function teamProgress(k, P, by) {
  const peserta = k.peserta || [];
  return timOf(k).map(d => {
    const mine = P.a.komp.filter(kp => d === k.dosen || !isObs(kp));
    const s = by[d] || {};
    const done = peserta.filter(n => mine.length && mine.every(kp => isNum((s[n] || {})[kp.id]))).length;
    const rec = DB.nilai.get(nkey(k.id, d));
    return { d, pj: d === k.dosen, done, total: peserta.length, at: rec && rec.updatedAt };

/* ---------- mesin perhitungan OBE ----------
   Rencana asesmen = matriks komponen × CPMK. Isi sel = bobot (% dari nilai akhir).
   Jumlah seluruh sel = 100.
     bobot komponen  = jumlah baris
     bobot CPMK (W)  = jumlah kolom
   Nilai akhir     NA   = Σ skor_komponen × bobot_komponen / 100
   Capaian CPMK    NC_j = Σ skor_k × sel_kj / Σ sel_kj    (skala 0–100)
   Konsistensi     NA   = Σ NC_j × W_j / 100  (sama dengan rumus Pedoman)
   Capaian CPL     = Σ NC_j × W_j × sks / Σ W_j × sks   untuk semua CPMK yang dipetakan ke CPL itu
   ------------------------------------------------ */
const CALC = new Map();
function plan(kelas) {
  const a = DB.asesmen.get(kelas.id) || { id: kelas.id, komp: [], mat: {} };
  return planFrom(a, cpmkOf(kelas.mk));
}
function planFrom(a, cp) {
  const cell = (k, c) => +((a.mat[k] || {})[c]) || 0;
  const rowSum = k => cp.reduce((s, c) => s + cell(k, c.id), 0);
  const W = {}; cp.forEach(c => W[c.id] = a.komp.reduce((s, k) => s + cell(k.id, c.id), 0));
  const total = cp.reduce((s, c) => s + W[c.id], 0);
  const issues = [];
  if (!cp.length) issues.push({ lv: "bad", t: "Mata kuliah ini belum punya CPMK. Tambahkan CPMK dulu di menu CPMK." });
  if (!a.komp.length) issues.push({ lv: "bad", t: "Belum ada komponen penilaian." });
  if (a.komp.length && Math.abs(total - 100) > 0.05) issues.push({ lv: "bad", t: `Total bobot ${fmt(total, 2)}%, harus 100%.` });
  const unmeasured = cp.filter(c => !W[c.id]);
  if (a.komp.length && unmeasured.length) issues.push({ lv: "warn", t: `CPMK tidak diukur komponen mana pun: ${unmeasured.map(c => "CPMK-" + c.no).join(", ")}. CPMK ini tidak akan menyumbang ke CPL.` });
  const empty = a.komp.filter(k => !rowSum(k.id));
  if (empty.length) issues.push({ lv: "bad", t: `Komponen tanpa bobot: ${empty.map(k => k.nama).join(", ")}.` });
  const valid = cp.length > 0 && a.komp.length > 0 && Math.abs(total - 100) <= 0.05 && !empty.length;
  return { a, cp, cell, rowSum, W, total, issues, valid };
}
function nilaiDoc(kelas) { return DB.nilai.get(kelas.id) || { id: kelas.id, scores: {}, status: "draft" }; }
function calcKelas(kelas) {
  if (CALC.has(kelas.id)) return CALC.get(kelas.id);
  const P = plan(kelas), N = nilaiDoc(kelas), S = SET();
  const BY = nilaiBy(kelas), COMB = combineScores(kelas, P.a.komp, BY);
  const rows = (kelas.peserta || []).map(nim => {
    const sc = COMB.sc[nim] || {};
    let filled = 0, na = 0;
    P.a.komp.forEach(k => { if (isNum(sc[k.id])) { filled++; na += +sc[k.id] * P.rowSum(k.id) / 100; } });
    const complete = P.a.komp.length > 0 && filled === P.a.komp.length;
    const NC = {};
    P.cp.forEach(c => {
      let num = 0, den = 0, ok = true;
      P.a.komp.forEach(k => { const m = P.cell(k.id, c.id); if (m > 0) { if (isNum(sc[k.id])) { num += +sc[k.id] * m; den += m; } else ok = false; } });
      NC[c.id] = den > 0 && ok ? num / den : null;
    });
    const NA = complete && P.valid ? na : null;
    return { nim, m: DB.mhs.get(nim) || { nama: "(tidak ditemukan)" }, sc, filled, complete, NA, H: huruf(NA), NC };
  }).sort((a, b) => a.nim.localeCompare(b.nim));
  const cls = {};
  P.cp.forEach(c => {
    const v = rows.map(r => r.NC[c.id]).filter(x => x != null);
    const avg = v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
    const tuntas = v.length ? v.filter(x => x >= S.ambangCPMK).length / v.length * 100 : null;
    cls[c.id] = { n: v.length, avg, tuntas, ok: tuntas != null && tuntas >= S.targetKelas, W: P.W[c.id] };
  });
  const dist = {}; S.skala.forEach(g => dist[g.h] = 0);
  rows.forEach(r => { if (r.H) dist[r.H.h]++; });
  const done = rows.filter(r => r.complete).length;
  const out = { P, N, BY, COMB, team: teamProgress(kelas, P, BY), rows, cls, dist, done, total: rows.length, final: N.status === "final" };
  CALC.set(kelas.id, out);
  return out;
}
function kelasStatus(k) {
  const R = calcKelas(k);
  if (!R.P.valid) return { lv: "bad", t: "Rencana asesmen belum valid", step: 0 };
  if (R.final) return { lv: "ok", t: "Nilai final", step: 3 };
  if (R.total && R.done === R.total) return { lv: "warn", t: "Nilai lengkap, belum final", step: 2 };
  return { lv: "warn", t: `Input nilai ${R.done}/${R.total}`, step: 1 };
}
/* Capaian CPL satu mahasiswa. scope: {ta, smt} atau null (kumulatif). */
function cplMahasiswa(nim, scope, includeDraft) {
  const acc = {}; cplList().forEach(c => acc[c.id] = { num: 0, den: 0, trace: [] });
  all("kelas").filter(k => (k.peserta || []).includes(nim) && (!scope || inPeriod(k, scope.ta, scope.smt))).forEach(k => {
    const R = calcKelas(k);
    if (!R.P.valid || (!R.final && !includeDraft)) return;
    const row = R.rows.find(r => r.nim === nim); if (!row) return;
    const mk = mkOf(k.mk), s = sks(mk) || 1;
    R.P.cp.forEach(c => {
      const W = R.P.W[c.id], v = row.NC[c.id];
      if (!W || v == null) return;
      const w = W / 100 * s;
      (c.cpl || []).forEach(id => { if (!acc[id]) return; acc[id].num += v * w; acc[id].den += w; acc[id].trace.push({ k, mk, c, W, v, w, final: R.final }); });
    });
  });
  return cplList().map(c => ({ ...c, val: acc[c.id].den ? acc[c.id].num / acc[c.id].den : null, skor: acc[c.id].num, maks: acc[c.id].den * 100, trace: acc[c.id].trace }));
}

       <select data-in="mkSel" aria-label="Pilih mata kuliah" style="max-width:100%;flex:1">${opts}</select>

        ${(c.sub || []).length ? `<ol class="small muted" style="margin:6px 0 0;padding-left:18px">${c.sub.map((s, i) => `<li>Sub-CPMK ${c.no}.${i + 1}: ${esc(s)}</li>`).join("")}</ol>` : ""}

function editCpmk(id) {

    <div class="field"><span>Dipetakan ke CPL</span><div class="checks">${cplList().map(x => `<label><input type="checkbox" name="cpl" value="${x.id}" ${(c.cpl || []).includes(x.id) ? "checked" : ""}>${x.id}${mk.cpl.includes(x.id) ? "" : ' <span class="muted small">(bukan CPL MK)</span>'}</label>`).join("")}</div></div>
    <label class="field"><span>Sub-CPMK, satu per baris</span><textarea name="sub">${esc((c.sub || []).join("\n"))}</textarea></label>

    async fd => {

/* Salin seluruh CPMK dari MK sumber ke MK tujuan, lalu sesuaikan rencana asesmen kelas MK tujuan
   yang masih memakai kode CPMK sumber (mis. kelas yang MK-nya diganti dari kurikulum 2024 ke kurikulum lama). */
async function copyCpmkSet(src, dst) {
  const from = cpmkOf(src); if (!from.length) throw new Error("Mata kuliah sumber belum punya CPMK.");
  const start = (cpmkOf(dst).at(-1)?.no || 0);
  const map = {};
  const recs = from.map((c, i) => { const id = dst + "-" + uid("c"); map[c.id] = id; return { id, mk: dst, no: start + i + 1, d: c.d, cpl: (c.cpl || []).slice(), sub: (c.sub || []).slice(), src: `Disalin dari ${src} CPMK-${c.no}` }; });
  await ensureKurikulumPersisted();
  await Store.saveMany("cpmk", recs);
  const fixes = all("kelas").filter(k => k.mk === dst).map(k => DB.asesmen.get(k.id)).filter(a => a && Object.values(a.mat || {}).some(r => Object.keys(r || {}).some(c => map[c])));
  const fixed = fixes.map(a => { const b = clone(a); Object.keys(b.mat || {}).forEach(kp => { const row = {}; Object.entries(b.mat[kp] || {}).forEach(([c, v]) => { row[map[c] || c] = v; }); b.mat[kp] = row; }); return b; });
  if (fixed.length) await Store.saveMany("asesmen", fixed);
  return { n: recs.length, kelas: fixed.length };
}
function copyCpmk(dstId, srcId) {
  const dst = mkOf(dstId || UI.mkSel); if (!dst) return;
  const cands = all("mk").filter(m => m.id !== dst.id && cpmkOf(m.id).length).sort(mkSort);
  const guess = srcId || (cands.find(m => String(m.n).trim().toLowerCase() === String(dst.n).trim().toLowerCase()) || {}).id || "";
  openDialog(`Salin CPMK ke ${dst.id}`, `<p class="small muted" style="margin-top:0">Semua CPMK beserta sub-CPMK dan pemetaan CPL dari mata kuliah sumber disalin ke <b>${esc(mkLabel(dst))}</b>. Cocok untuk mata kuliah kurikulum lama yang setara dengan mata kuliah Kurikulum 2024. Setelah disalin, CPMK tetap bisa diubah.</p>
    ${cpmkOf(dst.id).length ? `<div class="note">MK ini sudah punya ${cpmkOf(dst.id).length} CPMK. CPMK salinan akan ditambahkan setelahnya.</div>` : ""}
    <label class="field"><span>Mata kuliah sumber</span><select name="src" required><option value="">Pilih mata kuliah</option>${cands.map(m => `<option value="${esc(m.id)}" ${m.id === guess ? "selected" : ""}>${esc(mkLabel(m))} (${cpmkOf(m.id).length} CPMK)</option>`).join("")}</select></label>`,
    async fd => {
      const src = fd.get("src"); if (!src) { toast("Pilih mata kuliah sumber.", true); return false; }
      await guard(async () => { const r = await copyCpmkSet(src, dst.id); UI.mkSel = dst.id; toast(`${r.n} CPMK disalin dari ${src}.${r.kelas ? ` Rencana asesmen ${r.kelas} kelas ikut disesuaikan.` : ""}`); });
    }, "Salin CPMK");
}

VIEWS.audit = () => {
  const mks = all("mk"), rows = [];
  mks.forEach(m => {
    const cps = cpmkOf(m.id);
    if (!cps.length) { rows.push(["bad", m, "Belum ada CPMK", "Nilai MK ini tidak bisa dihitung ke CPL."]); return; }
    const meas = new Set(cps.flatMap(c => c.cpl || []));
    const off = [...meas].filter(c => !m.cpl.includes(c));
    const miss = m.cpl.filter(c => !meas.has(c));
    if (off.length && m.cpl.length) rows.push(["warn", m, `CPMK → ${off.join(", ")}`, `Buku Kurikulum membebankan ${m.cpl.join(", ")}.`]);
    if (miss.length) rows.push(["warn", m, `${miss.join(", ")} tidak diukur`, "CPL tercantum di Buku Kurikulum, tetapi tidak ada CPMK yang dipetakan."]);
  });
  const txt = new Map(); all("cpmk").forEach(c => { const k = c.d.toLowerCase().replace(/\s+/g, " ").trim(); if (!txt.has(k)) txt.set(k, []); txt.get(k).push(c); });
  const dup = [...txt.values()].filter(v => new Set(v.map(c => c.mk)).size > 1);
  const cps = all("cpmk");
  const cplCount = cplList().map(c => [c.id, cps.filter(x => (x.cpl || []).includes(c.id)).length]);
  return head("Audit keselarasan kurikulum", "Pemeriksaan otomatis antara Buku Kurikulum 2024, CPMK dari Excel, dan data yang tersimpan di aplikasi. Daftar ini ikut berubah setiap kali data MK atau CPMK diubah.")
    + `<section class="panel"><header><div><h2>Sebaran CPMK per CPL</h2><p>CPL tanpa CPMK tidak bisa dilaporkan capaiannya.</p></div></header><div class="body"><div class="checks">${cplCount.map(([id, n]) => `<span class="tag ${n ? "ok" : "bad"}">${id}: ${n} CPMK</span>`).join("")}</div></div></section>`

    + `<section class="panel"><header><div><h2>Catatan sumber dokumen</h2><p>Ditemukan saat menyusun data awal; perlu keputusan prodi.</p></div></header><div class="scroll"><table><thead><tr><th>Sumber</th><th>Catatan</th></tr></thead><tbody>

const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let _xlsxP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!_xlsxP) _xlsxP = new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = XLSX_URL;
    sc.onload = () => res(window.XLSX);
    sc.onerror = () => { _xlsxP = null; rej(new Error("Pembaca Excel gagal dimuat (periksa internet). Alternatif: salin sel dari Excel lalu tempel di kotak teks.")); };
    document.head.appendChild(sc);

  return _xlsxP;
}
async function fileToTSV(file) {
  try {
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = X.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false, blankrows: false });
    return rows.map(r => r.map(c => String(c).replace(/[\t\r\n]+/g, " ").trim()).join("\t")).join("\n");
  } catch (e) {
    if (/\.(csv|txt|tsv)$/i.test(file.name)) { const t = await file.text(); return /\t|;/.test(t) ? t : t.replace(/,/g, "\t"); }
    throw e;
  }
}
function splitRows(raw) {
  return String(raw || "").replace(/\r/g, "").split("\n").map(l => l.split(/\t|;/).map(x => x.trim())).filter(r => r.some(Boolean));
}
const normTxt = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

  const lk = key.toLowerCase(), ds = all("dosen");
  const d = ds.find(x => String(x.email || "").toLowerCase() === lk || (x.NUPTK && String(x.NUPTK).toLowerCase() === lk) || (x.nidn && String(x.nidn).toLowerCase() === lk));
  if (d) return d;
  const nk = normName(key); if (nk.length < 3) return null;
  let m = ds.filter(x => normName(x.nama) === nk); if (m.length === 1) return m[0];
  m = ds.filter(x => { const nx = normName(x.nama); return nx && (nx.startsWith(nk) || nk.startsWith(nx) || (nk.length >= 5 && nx.includes(nk))); });

  m = kt.length >= 2 ? ds.filter(x => { const xt = normName(x.nama).split(" "); return kt.every(w => xt.includes(w)); }) : [];

const isHeaderRow = r => { const t = normTxt(r.join(" ")); return /\bkode\b|nama dosen|\bnim\b.*\bkelas\b|\bkelas\b.*\bnim\b/.test(t) && !/\d{6,}/.test(r.join("")); };
const IK_SPEC = {

function parseImporKelas(raw, mode) {
  const S = PER(), rows = splitRows(raw), errs = [], groups = new Map(), newMk = new Map(), newMhs = new Map();
  if (rows.length && isHeaderRow(rows[0])) rows.shift();
  rows.forEach((r, i) => {
    const no = `Baris ${i + 1}`;

      const [kode, nmk, kls, dsn, peran, sksV, smtV] = r;
      if (!kode && !nmk) return;
      let mk = findMkBy(kode, nmk);
      if (mk === "ambigu") { errs.push(`${no}: nama MK "${nmk}" cocok dengan beberapa kode; isi kolom Kode MK.`); return; }
      const code = String(kode || "").toUpperCase().replace(/\s+/g, "");
      if (!mk) {
        if (!code || !nmk) { errs.push(`${no}: mata kuliah "${kode || nmk}" belum terdaftar. Isi Kode MK dan Nama MK agar dibuat otomatis.`); return; }
        mk = newMk.get(code) || { id: code, n: String(nmk).trim(), s: Math.min(8, Math.max(1, parseInt(smtV, 10) || 1)), t: Math.max(0, parseInt(sksV, 10) || 2), p: 0, j: "Wajib", kur: "Lama", cpl: [] };

      const g = groups.get(key) || { mk, nama, pj: null, tim: [], unknown: [], dosenGiven: false };
      groups.set(key, g);
      if (dsn) {
        g.dosenGiven = true;

        if (!d) { if (!g.unknown.includes(dsn)) g.unknown.push(dsn); }

        else if (d.id !== g.pj && !g.tim.includes(d.id)) g.tim.push(d.id);

      const [kode, kls, nimV, nmM] = r;

      const mk = findMkBy(kode, "");
      if (!mk) { errs.push(`${no}: kode MK "${kode}" belum terdaftar. Jalankan langkah 1 (kelas & dosen) dulu.`); return; }
      if (!nim) { errs.push(`${no}: NIM kosong.`); return; }
      const nama = String(kls || "").trim() || "A", key = mk.id + "||" + nama;
      const g = groups.get(key) || { mk, nama, peserta: new Set(), unknownNim: new Set() };
      groups.set(key, g);
      g.peserta.add(nim);

function presetPlan(k) {
  const cp = cpmkOf(k.mk), n = cp.length; if (!n) return;
  const idx = { all: [...Array(n).keys()], first: [0], second: [Math.min(1, n - 1)], firstHalf: [...Array(Math.ceil(n / 2)).keys()], secondHalf: [...Array(n).keys()].slice(Math.floor(n / 2)) };
  const a = { id: k.id, komp: [], mat: {} };
  PRESET.forEach(p => {
    a.komp.push({ id: p.id, nama: p.nama, bentuk: p.bentuk });
    const t = idx[p.to].length ? idx[p.to] : [0];
    let left = p.w; a.mat[p.id] = {};
    t.forEach((i, j) => { const v = j === t.length - 1 ? Math.round(left * 100) / 100 : Math.round(p.w / t.length * 100) / 100; a.mat[p.id][cp[i].id] = v; left -= v; });
  });
  UI.edit.a = a;
}

function refreshNilaiRow(nim) {
  const k = DB.kelas.get(UI.p.id), P = plan(k);

function tabRekap(k, mk, R) {
  const komp = R.P.a.komp;

  const canFinal = canEditKelas(k) && R.P.valid && R.total > 0 && !incomplete && !R.final;
  const lagging = timOf(k).length > 1 ? R.team.filter(t => t.done < t.total) : [];
  return `<section class="panel"><header><div><h2>Finalisasi nilai</h2><p>${R.final ? `Final pada ${esc(R.N.finalAt || "")} oleh ${esc(R.N.finalBy || "")}.` : incomplete ? `${incomplete} mahasiswa belum bernilai lengkap.` : "Semua nilai lengkap."}</p></div>
      <div class="actions">${canFinal ? `<button class="btn primary" data-act="finalize">Finalkan nilai</button>` : ""}${R.final && isAdmin() ? `<button class="btn danger" data-act="unlock">Buka kunci</button>` : ""}<button class="btn" data-act="print">Cetak</button><button class="btn" data-act="csvRekap">Unduh CSV</button></div></header>
      ${lagging.length && !R.final ? `<div class="body"><div class="note" style="margin:0">Team teaching: ${lagging.map(t => `${esc(dosenName(t.d))} baru ${t.done}/${t.total} mahasiswa`).join("; ")}. Nilai gabungan saat ini memakai rata-rata dari dosen yang sudah mengisi. Pastikan semua anggota tim selesai sebelum finalisasi.</div></div>` : ""}
      <div class="body small">Setelah final, nilai dan rencana asesmen terkunci, lalu nilai kelas dihitung ke capaian CPL mahasiswa dan laporan semester. Hanya admin prodi yang dapat membuka kunci.</div></section>`
    + `<section class="panel"><header><div><h2>Rekapitulasi nilai mata kuliah</h2><p>Format Lampiran 4 Pedoman Penilaian UNBL. ${esc(k.mk)} ${esc(mk.n)}, kelas ${esc(k.nama)}, ${esc(k.smt)} ${esc(k.ta)}, dosen PJMK ${esc(dosenName(k.dosen))}${(k.tim || []).length ? `, tim ${k.tim.map(d => esc(dosenName(d))).join(", ")} (nilai = rata-rata tim)` : ""}.</p></div></header>

      ${R.rows.map((r, i) => `<tr><td class="n">${i + 1}</td><td>${esc(r.nim)}</td><td>${esc(r.m.nama)}</td>${komp.map(kp => `<td class="num">${isNum(r.sc[kp.id]) ? fmt(+r.sc[kp.id], 1) : "–"}</td>`).join("")}<td class="num sum">${fmt(r.NA, 2)}</td><td>${r.H ? r.H.h : "–"}</td></tr>`).join("")}</tbody></table></div></section>`
    + `<section class="panel"><header><h2>Distribusi huruf mutu</h2></header><div class="scroll"><table><thead><tr>${SET().skala.map(g => `<th class="n">${g.h}</th>`).join("")}<th class="n">Belum</th></tr></thead><tbody><tr>${SET().skala.map(g => `<td class="num">${R.dist[g.h]}</td>`).join("")}<td class="num">${incomplete}</td></tr></tbody></table></div></section>`;
}

      <table><tbody><tr><td rowspan="2" class="lbl" style="vertical-align:middle">OTORISASI / PENGESAHAN</td><th class="ctr">Dosen Pengembang RPS</th><th class="ctr">Koordinator RMK</th><th class="ctr">Ketua Program Studi</th></tr>
        <tr><td class="sign"><br><br><b>${esc(dosenName(k.dosen))}</b></td><td class="sign"><br><br>${fill("koor", "Nama koordinator RMK")}</td><td class="sign"><br><br>${fill("kaprodi", "Nama Ketua Program Studi")}</td></tr></tbody></table>

          <tbody>${weeks}<tr><th colspan="7" style="text-align:right">Total bobot penilaian</th><th class="ctr" id="rpsTot">–</th></tr></tbody></table>

function rpsTotal() {
  const el = $("#rpsTot"); if (!el) return;
  let t = 0, n = 0;
  $$('[data-rps$="_bobot"]').forEach(x => { const v = parseFloat(String(x.innerText).replace(",", ".").replace("%", "")); if (!isNaN(v)) { t += v; n++; } });
  el.textContent = n ? fmt(t, 1) + "%" : "–";
  el.style.color = n && Math.abs(t - 100) > 0.05 ? "#a93f2c" : "";
}
document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest("[data-rps]"); if (!el) return;
  if (UI.edit && UI.edit.kind === "rps") { UI.edit.dirty = true; const d = $("#rpsDirty"); if (d) d.textContent = "Ada perubahan belum disimpan"; }
  if (/_bobot$/.test(el.dataset.rps)) rpsTotal();
});
document.addEventListener("paste", e => {
  const el = e.target.closest && e.target.closest('[data-rps][contenteditable="true"]'); if (!el) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData("text");
  document.execCommand("insertText", false, t);
});

/* ---------- Capaian CPL mahasiswa ---------- */
function radar(items, target) {
  const n = items.length, cx = 160, cy = 150, rad = 110;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * rad * v / 100, cy + Math.sin(a) * rad * v / 100]; };
  const ring = v => items.map((_, i) => pt(i, v).join(",")).join(" ");
  const meas = items.map((it, i) => [it, i]).filter(x => x[0].val != null);
  const poly = meas.map(([it, i]) => pt(i, it.val).join(",")).join(" ");
  return `<svg viewBox="0 0 320 300" width="100%" role="img" aria-label="Radar capaian CPL">
    ${[25, 50, 75, 100].map(v => `<polygon points="${ring(v)}" fill="none" stroke="#d9dee6" stroke-width="1"/>`).join("")}
    <polygon points="${ring(target)}" fill="none" stroke="#d99a1e" stroke-width="1.5" stroke-dasharray="4 3"/>

function semesterData(includeDraft) {
  const S = { ...SET(), ...PER() };
  const ks = all("kelas").filter(k => inPeriod(k)).sort((a, b) => a.mk.localeCompare(b.mk));
  const used = ks.filter(k => { const R = calcKelas(k); return R.P.valid && (R.final || includeDraft); });
  const nims = [...new Set(used.flatMap(k => k.peserta || []))].sort();
  const mhs = nims.map(n => {
    const cpl = cplMahasiswa(n, S, includeDraft);
    let num = 0, den = 0;
    used.filter(k => k.peserta.includes(n)).forEach(k => { const r = calcKelas(k).rows.find(x => x.nim === n); if (r && r.H) { const s = sks(mkOf(k.mk)); num += r.H.b * s; den += s; } });
    return { nim: n, m: DB.mhs.get(n) || { nama: "?" }, cpl, ips: den ? num / den : null, sks: den };
  });
  const cplProdi = cplList().map(c => {
    const v = mhs.map(x => x.cpl.find(y => y.id === c.id).val).filter(x => x != null);
    return { c, n: v.length, avg: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null, pct: v.length ? v.filter(x => x >= S.targetCPL).length / v.length * 100 : null };
  });
  return { S, ks, used, mhs, cplProdi };
}
